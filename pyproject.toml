[project]
name = "sweb"
version = "0.1.0"
description = "Web browser for seniors"
authors = [
    {name = "Adam Biciste"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyqt5 (>=5.15.11,<6.0.0)",
    "pyqtwebengine (>=5.15.7,<6.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
