name: Manual workflow
on:
  workflow_dispatch:

jobs:
  create-package:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
    - uses: actions/checkout@v7
    - name: Prepare system
      run: pacman -Sy base-devel sudo --noconfirm
    - name: Build
      run: |
        source packaging/PKGBUILD
        pacman -S --needed --noconfirm "${depends[@]}" "${makedepends[@]}"
        chown -R nobody packaging
        cd packaging
        sudo -u nobody makepkg --noconfirm 
        ls
