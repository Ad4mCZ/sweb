name: Manual workflow
on:
  workflow_dispatch:

jobs:
  create-package:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
    - uses: actions/checkout@v7
    - name: Prepare system
      run: pacman --noconfirm -Sy base-devel sudo
    - name: Add nobody to sudoers
      run: |
        echo "nobody ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers || return 1 
    - name: Build
      run: chown nobody packaging && cd packaging && sudo -u nobody makepkg -s --noconfirm && ls
