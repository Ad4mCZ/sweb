name: Fedora package
on:
  workflow_dispatch: 
jobs:
  fedora-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare dependencies
        run: |
          dnf -y install rpmdevtools
          cd packaging
          dnf builddep -y sweb.spec
          rpmbuild -br --define "_topdir $PWD" sweb.spec
          echo "PRINTING DIRECTORY"
          ls
          pwd
          echo "END PRINT"
          dnf builddep -y SRPMS/*.buildreqs.nosrc.rpm
      - name: Build
        run: |
          cd packaging
          spectool -g -R sweb.spec
          rpmbuild -ba --define "_topdir $PWD" sweb.spec
          ls
