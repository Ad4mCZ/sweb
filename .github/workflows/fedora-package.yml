name: Fedora package
on:
  workflow_dispatch: 
jobs:
  fedora-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare dependencies
        run: |
          cd packaging
          rpmbuild -br --define "_topdir $PWD/rpmbuild" sweb.spec
          dnf -y builddep rpmbuild/SRPMS/*.buildreqs.nosrc.rpm
      - name: Build
        run: |
          cd packaging
          spectool -g -R sweb.spec
          rpmbuild -ba sweb.spec
          ls
