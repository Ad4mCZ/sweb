name: Fedora package
on:
  workflow_dispatch: 
jobs:
  fedora-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare dependencies
        run: |
          dnf -y install rpmdevtools rpm-build python3-devel
          dnf -y builddep packaging/sweb.spec
      - name: Download sources
        run: |
          rpmdev-setuptree
          spectool -g -R packaging/*.spec
      - name: Generate build requires
        run: |
          rpmbuild -br packaging/sweb.spec
      - name: Install build require
        run: |
          dnf -y builddep ~/rpmbuild/SRPMS/*.buildreqs.nosrc.rpm
      - name: Build
        run: |
          rpmbuild -ba packaging/sweb.spec
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ~/rpmbuild/RPMS/**/sweb-*.rpm
          file_glob: true
          tag: refs/tags/v0.1.0
          overwrite: true
          draft: false
          prerelease: true
          body: "Working release ${{github.ref}}"
