name: Fedora package
on:
  push:
    tags: ["v*"]
jobs:
  fedora-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v7
      - name: Update spec version
        run: |
          sed -i "0,/^Version:/s/^Version:.*/Version:        ${GITHUB_REF_NAME#v}/" packaging/sweb.spec
      - name: Prepare dependencies
        run: |
          dnf -y install rpmdevtools rpm-build python3-devel pyproject-rpm-macros
          dnf -y builddep packaging/sweb.spec

      - name: Download sources
        run: |
          rpmdev-setuptree
          spectool -g -R packaging/*.spec
      - name: Generate build requires
        run: |
          for i in 1 2 3; do
            exit_code=0
            rpmbuild -br packaging/sweb.spec || exit_code=$?
            [ "$exit_code" -eq 0 ] && break
            [ "$exit_code" -ne 11 ] && exit "$exit_code"
            dnf -y builddep ~/rpmbuild/SRPMS/*.buildreqs.nosrc.rpm
          done
      - name: Build
        run: |
          rpmbuild -ba packaging/sweb.spec
      - name: Upload artifact
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: /github/home/rpmbuild/RPMS/noarch/sweb-*.rpm
          file_glob: true
          tag: ${{github.ref}}
          overwrite: true
          draft: false
          prerelease: false
