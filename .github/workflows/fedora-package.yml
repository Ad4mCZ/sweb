name: Fedora package
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for build"
        required: true
        type: string
jobs:
  fedora-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      matrix:
        fedora: ["latest", "44"]
    container:
      image: fedora:${{ matrix.fedora }}
    steps:
      - name: Get tag
        id: tag
        env:
          INPUT_TAG: ${{inputs.tag}}
          REF_NAME: ${{github.ref_name}}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - name: Update spec version
        env:
          VER: ${{steps.tag.outputs.version}}
        run: |
          sed -i "0,/^Version:/s/^Version:.*/Version:        ${VER}/" packaging/sweb.spec
      - name: Prepare dependencies
        run: |
          dnf -y install rpmdevtools rpm-build python3-devel pyproject-rpm-macros
          dnf -y builddep packaging/sweb.spec
      - name: Import keys
        env:
          GPG_PRIVATE_KEY: ${{secrets.GPG_PRIVATE_KEY}}
          GNUPGHOME: /temp
        run: |
          dnf install -y rpm-sign gnupg2
          mkdir -m 700 -p "$GNUPGHOME"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Download sources
        run: |
          rpmdev-setuptree
          spectool -g -R packaging/*.spec
      - name: Generate build requires
        run: |
          for i in 1 2 3; do
            exit_code=0
            rpmbuild -br packaging/sweb.spec || exit_code=$?
            [ "$exit_code" -eq 0 ] && break
            [ "$exit_code" -ne 11 ] && exit "$exit_code"
            dnf -y builddep ~/rpmbuild/SRPMS/*.buildreqs.nosrc.rpm
          done
      - name: Build
        env:
          GPG_KEY_ID: ${{secrets.GPG_KEY_ID}}
          GNUPGHOME: /temp
        run: |
          rpmbuild -ba packaging/sweb.spec
          echo "%_gpg_name $GPG_KEY_ID" > ~/.rpmmacros
          rpmsign --addsign /github/home/rpmbuild/RPMS/noarch/*.rpm
      - name: Upload artifact
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: /github/home/rpmbuild/RPMS/noarch/sweb-*.rpm
          file_glob: true
          tag: ${{steps.tag.outputs.name}}
          overwrite: true
          draft: false
          prerelease: false
