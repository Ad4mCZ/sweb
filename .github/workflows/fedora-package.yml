name: Fedora package
on:
  workflow_dispatch: 
  push:
    tags: ["v*"]
jobs:
  fedora-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare dependencies
        run: |
          dnf -y install rpmdevtools rpm-build python3-devel
          dnf -y builddep packaging/sweb.spec
      - name: Update spec version
        run: |
          VERSION=0.2.0
          sed -i "s/^Version:.*/Version:        ${VERSION}/" packaging/sweb.spec
      - name: Download sources
        run: |
          rpmdev-setuptree
          spectool -g -R packaging/*.spec
      - name: Generate build requires
        run: |
          set +e
          rpmbuild -br packaging/sweb.spec
          exit_code=$?
          if [ $exit_code -ne 0 ] && [ $exit_code -ne 11 ]; then exit $rc; fi
      - name: Install build require
        run: |
          dnf -y builddep ~/rpmbuild/SRPMS/*.buildreqs.nosrc.rpm
      - name: Build
        run: |
          rpmbuild -ba packaging/sweb.spec
      - name: Upload artifact
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: /github/home/rpmbuild/RPMS/noarch/sweb-*.rpm
          file_glob: true
          tag: refs/tags/v0.2.0
          overwrite: true
          draft: false
          prerelease: false
