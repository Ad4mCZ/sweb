name: Arch package
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for build"
        required: true
        type: string
jobs:
  create-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: archlinux:latest
    steps:
    - name: Get tag
      id: tag
      env:
        INPUT_TAG: ${{inputs.tag}}
        REF_NAME: ${{github.ref_name}}
      run: |
        TAG="{INPUT_TAG:-$REF_NAME}"
        echo "name=$TAG" >> "$GITHUB_OUTPUT"
        echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@v7
      env:
        TAG: ${{steps.tag.outputs.name}}
      with:
        ref: ${TAG}
    - name: Update pkgver
      env:
        VER: ${{steps.tag.outputs.version}}
      run: |
        sed -i "0,/^pkgver=/s/^pkgver=.*/pkgver=${VER}/" packaging/PKGBUILD
    - name: Prepare system
      run: |
        pacman -Sy base-devel sudo --noconfirm
    - name: Get build dependencies
      run: |
        source packaging/PKGBUILD
        pacman -S --needed --noconfirm "${depends[@]}" "${makedepends[@]}"
    - name: Build
      run: |
        chown -R nobody packaging
        cd packaging
        sudo -u nobody makepkg --noconfirm 
    - name: Upload artifact
      uses: svenstaro/upload-release-action@v2
      env:
        TAG: ${{steps.tag.outputs.name}}
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: packaging/sweb-*.pkg.tar.zst
        file_glob: true
        tag: ${TAG}
        overwrite: true
        draft: false
        prerelease: false
