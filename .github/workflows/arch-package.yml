name: Arch package
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  create-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: archlinux:latest
    steps:
    - uses: actions/checkout@v7
    - name: Update pkgver
      run: |
        sed -i "s/^pkgver=.*/pkgver=${GITHUB_REF_NAME}/" packaging/PKGBUILD
    - name: Prepare system
      run: |
        pacman -Sy base-devel sudo --noconfirm
    - name: Get build dependencies
      run: |
        source packaging/PKGBUILD
        pacman -S --needed --noconfirm "${depends[@]}" "${makedepends[@]}"
    - name: Build
      run: |
        chown -R nobody packaging
        cd packaging
        sudo -u nobody makepkg --noconfirm 
    - name: Upload artifact
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: packaging/sweb-*.pkg.tar.zst
        file_glob: true
        tag: ${{github.ref}}
        overwrite: true
        draft: false
        prerelease: false
