name: Arch package
on:
  workflow_dispatch:

jobs:
  create-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: archlinux:latest
    steps:
    - uses: actions/checkout@v7
    - name: Prepare system
      run: pacman -Sy base-devel sudo --noconfirm
    - name: Build
      run: |
        source packaging/PKGBUILD
        pacman -S --needed --noconfirm "${depends[@]}" "${makedepends[@]}"
        chown -R nobody packaging
        cd packaging
        sudo -u nobody makepkg --noconfirm 
        ls
    - name: Upload binaries to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: packaging/sweb-*.pkg.tar.zst
        file_glob: true
        tag: refs/tags/v0.1.0
        overwrite: true
        draft: true
        body: "Testing release package"
